name: HOA CI & Evaluation Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 0 * * *'  # Nightly at midnight UTC
  workflow_dispatch:

jobs:
  # ── Job 1: Security scanning ─────────────────────────────────────────────────
  security-scan:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for secret scan

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install security tools
        run: pip install pip-audit detect-secrets

      - name: pip-audit (known CVEs in dependencies)
        run: pip-audit -r backend/requirements.txt --strict

      - name: detect-secrets baseline check
        run: |
          detect-secrets scan --baseline .secrets.baseline || true
          detect-secrets audit .secrets.baseline --report || true

      - name: Grep for hardcoded secrets (fail-fast)
        run: |
          # Fail if any .py/.yml file contains a bare secret pattern
          ! grep -rn --include="*.py" --include="*.yml" \
            -E "(sk-|AKIA[A-Z0-9]{16}|-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY)" \
            . || (echo "❌ Potential secret found" && exit 1)

  # ── Job 2: Unit tests & safety suite ─────────────────────────────────────────
  test-and-safety:
    name: Run Unit Tests & Safety Suite
    runs-on: ubuntu-latest
    needs: security-scan

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: hoa_db
          POSTGRES_USER: hoa_user
          POSTGRES_PASSWORD: hoa_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql://hoa_user:hoa_password@localhost:5432/hoa_db
          PYTHONPATH: backend
        run: |
          cd backend && alembic upgrade head

      - name: Seed demo users
        env:
          DATABASE_URL: postgresql://hoa_user:hoa_password@localhost:5432/hoa_db
          PYTHONPATH: backend
        run: |
          cd backend && python -m app.seed

      - name: Run Unit Tests & Safety Suite (Must be 100% pass)
        env:
          DATABASE_URL: postgresql://hoa_user:hoa_password@localhost:5432/hoa_db
          PYTHONPATH: backend
          LLM_PROVIDER: template
          JWT_SECRET: ci-test-secret-not-for-production
          AUDIT_HMAC_KEY: ci-test-hmac-key-not-for-production
          VAULT_KEY: ""
        run: |
          pytest backend/tests/ -v --tb=short

  # ── Job 3: Nightly evaluation benchmark ──────────────────────────────────────
  evaluation-nightly:
    name: Nightly Evaluation Benchmark & Proof of Value
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: test-and-safety
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: hoa_db
          POSTGRES_USER: hoa_user
          POSTGRES_PASSWORD: hoa_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Migrations & Seed DB
        env:
          DATABASE_URL: postgresql://hoa_user:hoa_password@localhost:5432/hoa_db
          PYTHONPATH: backend
        run: |
          cd backend && alembic upgrade head
          cd backend && python -m app.seed

      - name: Run Evaluation Harness (Must be >= 90% routing accuracy)
        env:
          DATABASE_URL: postgresql://hoa_user:hoa_password@localhost:5432/hoa_db
          PYTHONPATH: backend
          LLM_PROVIDER: template
          JWT_SECRET: ci-test-secret-not-for-production
          AUDIT_HMAC_KEY: ci-test-hmac-key-not-for-production
          VAULT_KEY: ""
        run: |
          cd backend && python -m app.eval.cli --strict
